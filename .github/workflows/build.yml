name: Compilar Meg (notas.html)

on:
  push:
    branches: [main]
    paths:
      - 'Meg.jsx'
      - 'entry.jsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-notas
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar React, D3 e Lucide de verdade (para empacotar tudo junto)
        run: npm install --no-save react@18.3.1 react-dom@18.3.1 d3@7.9.0 lucide-react@0.383.0

      - name: Compilar tudo num único arquivo autossuficiente (sem CDN em tempo de execução)
        run: |
          npx --yes esbuild@0.23.1 entry.jsx --bundle --format=iife --jsx=transform \
            --outfile=meg.compiled.js

      - name: Montar o notas.html
        run: |
          cat > notas.html << 'CABECALHO'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
          <title>Meg — Notas</title>
          <style>
            html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; overscroll-behavior: none; }
            #root { height: 100%; }
          </style>
          </head>
          <body>
          <div id="root"></div>
          <script>
          CABECALHO
          cat meg.compiled.js >> notas.html
          cat >> notas.html << 'RODAPE'
          </script>
          </body>
          </html>
          RODAPE

      - name: Publicar notas.html no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notas.html
          git diff --quiet --cached || git commit -m "Compilar Meg.jsx -> notas.html [automático]"
          git push
