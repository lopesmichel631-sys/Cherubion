/* ── armazenamento local (fora do sandbox não existe window.storage) ── */
if (typeof window !== "undefined" && !window.storage) {
    window.storage = {
        async get(k) {
            const v = window.localStorage.getItem(k);
            if (v === null)
                throw new Error("chave inexistente: " + k);
            return { key: k, value: v };
        },
        async set(k, v) {
            window.localStorage.setItem(k, v);
            return { key: k, value: v };
        },
        async delete(k) {
            window.localStorage.removeItem(k);
            return { key: k, deleted: true };
        },
        async list(prefixo) {
            const ks = [];
            for (let i = 0; i < window.localStorage.length; i++) {
                const k = window.localStorage.key(i);
                if (!prefixo || k.startsWith(prefixo))
                    ks.push(k);
            }
            return { keys: ks };
        },
    };
}
/* ── entrada automática pela URL: #perfil=<texto do print> ── */
const perfilDaURL = () => {
    if (typeof window === "undefined")
        return "";
    const bruto = window.location.hash || window.location.search || "";
    const m = bruto.match(/[#?&]perfil=([^&]*)/);
    if (!m)
        return "";
    try {
        return decodeURIComponent(m[1].replace(/\+/g, " "));
    }
    catch {
        return "";
    }
};
const cartoesDaURL = () => {
    if (typeof window === "undefined")
        return [];
    const bruto = window.location.hash || window.location.search || "";
    const m = bruto.match(/[#?&]cartoes=([^&]*)/);
    if (!m)
        return [];
    try {
        const v = JSON.parse(decodeURIComponent(m[1].replace(/\+/g, " ")));
        return Array.isArray(v) ? v : [v];
    }
    catch {
        return [];
    }
};
const limparURL = () => {

const CHAVE_GH_TOKEN = "meg:ghtoken";

const GIST_ARQUIVO = "perfis-meg.json";
const buscarGist = async (token, gistId) => {
    const r = await fetch("https://api.github.com/gists/" + gistId, {
        headers: { Authorization: "token " + token, Accept: "application/vnd.github+json" },
    });
    if (!r.ok)
        throw new Error(r.status === 404 ? "gist não encontrado" : "erro " + r.status);
    const j = await r.json();
    const arq = j.files && j.files[GIST_ARQUIVO];
    if (!arq || !arq.content)
        return [];
    try {
        const v = JSON.parse(arq.content);
        return Array.isArray(v) ? v : [];
    }
    catch {
        return [];
    }
};
const limparGist = async (token, gistId) => {

        method: "PATCH",
        headers: {
            Authorization: "token " + token,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
        },
        body: JSON.stringify({ files: { [GIST_ARQUIVO]: { content: "[]" } } }),
    });
};
/* ── comprime uma foto escolhida para caber tranquilo num Gist ── */
const comprimirFoto = (arquivo, ladoMax = 480, qualidade = 0.62) => new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onerror = () => reject(new Error("falha ao ler o arquivo"));
    leitor.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("arquivo não é uma imagem válida"));
        img.onload = () => {
            const escala = Math.min(1, ladoMax / Math.max(img.width, img.height));
            const w = Math.round(img.width * escala);
            const h = Math.round(img.height * escala);
            const tela = document.createElement("canvas");
            tela.width = w;
            tela.height = h;
            const ctx = tela.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(tela.toDataURL("image/jpeg", qualidade));
        };
        img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
});

  padding:8px 14px;cursor:pointer;border-radius:2px;color:${C.ink};background:${C.card};border:1px solid ${C.card};
  transition:filter .15s ease,background .15s ease,color .15s ease;}
.bc-backupbtn:hover{filter:brightness(1.08);}
.bc-backupbtn:active{transform:translateY(1px);}
.bc-file{display:none;}

/* minha cidade */
.bc-homecity{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:14px;}
.bc-homefield{display:block;}
.bc-lbl-dark{color:rgba(251,247,238,.45);}
.bc-homeinput{font-family:'Bodoni Moda',serif;font-size:19px;color:${C.card};background:transparent;
  border:none;border-bottom:1px solid rgba(251,247,238,.3);padding:2px 0 4px;min-width:190px;}
.bc-homeinput::placeholder{color:rgba(251,247,238,.28);}
.bc-homeinput:focus{outline:none;border-bottom-color:#E86A7C;}
.bc-homestatus{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(251,247,238,.4);padding-bottom:6px;}
.bc-homestatus-erro{color:#E86A7C;}

.bc-new{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  padding:11px 20px;color:${C.card};background:var(--red);border:none;border-radius:2px;cursor:pointer;
  transition:transform .15s ease,filter .15s ease;}
.bc-new:hover{filter:brightness(1.12);transform:translateY(-1px);}

.bc-tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;max-width:1200px;margin:20px auto 26px;}
.bc-search{flex:1 1 220px;min-width:190px;font-family:inherit;font-size:13px;padding:10px 14px;color:${C.card};
  background:rgba(251,247,238,.06);border:1px solid rgba(251,247,238,.14);border-radius:2px;}
.bc-search::placeholder{color:rgba(251,247,238,.35);}
.bc-filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.bc-chip{font-family:inherit;font-size:11px;letter-spacing:.06em;padding:8px 13px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;gap:6px;color:rgba(251,247,238,.72);background:transparent;
  border:1px solid rgba(251,247,238,.2);}
.bc-chip-on{background:${C.card};color:${C.ink};border-color:${C.card};}
.bc-chip .bc-g-red{color:#E86A7C;}
.bc-chip-on .bc-g-red{color:var(--red);}
.bc-raio{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;
  color:rgba(251,247,238,.5);border:1px dashed rgba(251,247,238,.2);border-radius:2px;padding:6px 10px;}
.bc-raioinput{width:52px;font-family:inherit;font-size:12px;text-align:center;color:${C.card};
  background:transparent;border:none;border-bottom:1px solid rgba(251,247,238,.3);padding:1px 0 2px;}
.bc-raioinput::placeholder{color:rgba(251,247,238,.28);}
.bc-raioinput:focus{outline:none;border-bottom-color:#E86A7C;}

.bc-empty{max-width:1200px;margin:80px auto;text-align:center;font-size:14px;color:rgba(251,247,238,.45);}
.bc-empty-sm{margin:26px auto;font-size:13px;}

.bc-grid{max-width:1200px;margin:0 auto;display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));}
.bc-lista{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;align-items:start;}
.bc-lista > .bc-card{grid-column:1 / -1;}

/* cartão compacto */
.bc-linhacarta{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  text-align:left;cursor:pointer;font-family:inherit;background:var(--card);color:var(--ink);border:none;
  border-radius:5px;padding:13px 14px;box-shadow:0 6px 14px rgba(0,0,0,.3);
  transition:transform .14s ease,box-shadow .14s ease;}
.bc-linhacarta:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(0,0,0,.4);}
.bc-lc-topo{display:flex;align-items:baseline;gap:7px;width:100%;min-width:0;}
.bc-lc-foto{width:26px;height:26px;border-radius:5px;object-fit:cover;flex:0 0 auto;align-self:center;}
.bc-lc-naipe{font-size:13px;color:var(--ink);flex-shrink:0;}
.bc-lc-nome{font-family:'Bodoni Moda',serif;font-size:19px;font-weight:600;line-height:1.15;
  min-width:0;overflow-wrap:anywhere;}
.bc-lc-linha{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bc-lc-dado{font-size:12.5px;color:var(--soft);}
.bc-lc-sep{font-size:11px;color:rgba(122,112,101,.55);}
.bc-lc-local{font-size:12.5px;color:var(--ink);width:100%;overflow-wrap:anywhere;
  border-top:1px dotted rgba(205,194,170,.8);padding-top:5px;margin-top:1px;}

/* rodapé da carta */
.bc-rodape{margin-top:10px;padding-top:11px;border-top:1px solid rgba(205,194,170,.6);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.bc-criadoem{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);}
.bc-racaopts{margin-top:-4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;}
.bc-racaopts::-webkit-scrollbar{display:none;}
.bc-racaopts .bc-pill{flex-shrink:0;padding:6px 9px;font-size:11px;}
.bc-tools2{margin-top:-14px;}
.bc-remover{font-family:inherit;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 20px;cursor:pointer;border-radius:2px;color:var(--soft);background:transparent;
  border:1px solid var(--edge);}
.bc-remover:hover{color:var(--red);border-color:var(--red);}
.bc-remover-on{color:var(--card);background:var(--red);border-color:var(--red);}

/* semáforo */
.bc-semaforo{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:9px;
  background:#241C29;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);}
.bc-luz{width:12px;height:12px;padding:0;border-radius:50%;cursor:pointer;
  background:rgba(251,247,238,.14);border:1px solid rgba(251,247,238,.18);transition:transform .12s ease;}
.bc-luz:hover{transform:scale(1.15);}
.bc-luz-on{box-shadow:0 0 7px currentColor;}
.bc-lc-farol{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-left:auto;
  box-shadow:0 0 0 1.5px rgba(21,16,15,.12);}
.bc-chipluz{width:8px;height:8px;border-radius:50%;display:inline-block;}

.bc-cardtop{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:8px;}
.bc-recolher{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  background:var(--card);border:1px solid var(--edge);border-radius:3px;cursor:pointer;color:var(--ink);
  padding:7px 12px;display:inline-flex;align-items:center;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.08);
  transition:background .14s ease,border-color .14s ease;}
.bc-recolher:hover{background:var(--ink);color:var(--card);border-color:var(--ink);}
.bc-recolher:active{transform:translateY(1px);}

/* dating */
.bc-dating{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.bc-datingbox{display:block;}
.bc-datinglbl{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);margin-bottom:2px;}
.bc-datingtexto{width:100%;font-family:inherit;font-size:12px;line-height:1.5;color:var(--ink);resize:vertical;
  background:rgba(251,247,238,.6);border:1px solid var(--edge);border-radius:2px;padding:6px 8px;}
.bc-datingtexto:focus{outline:none;border-color:var(--red);}

.bc-fcbtn{width:100%;font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;padding:11px 14px;cursor:pointer;border-radius:2px;color:var(--card);
  background:var(--ink);border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;}
.bc-fcbtn:hover{background:var(--red);border-color:var(--red);}
.bc-fcbtn em{font-style:normal;font-size:10px;opacity:.7;}

/* painel FC Skill */
.bc-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;
  padding:28px 16px;background:rgba(16,10,20,.78);overflow-y:auto;}
.bc-modalbox{width:100%;max-width:620px;background:var(--card);color:var(--ink);border-radius:6px;
  box-shadow:0 30px 60px rgba(0,0,0,.55);}
.bc-modalhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:18px 20px 14px;border-bottom:1px solid rgba(205,194,170,.7);}
.bc-modaleyebrow{margin:0 0 4px;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);}
.bc-modaltitulo{margin:0;font-family:'Bodoni Moda',serif;font-size:25px;font-weight:600;}
.bc-modalx{font-family:inherit;font-size:22px;line-height:1;background:none;border:none;cursor:pointer;
  color:rgba(21,16,15,.35);padding:0 4px;}
.bc-modalx:hover{color:var(--red);}
.bc-modalbody{display:flex;flex-direction:column;gap:13px;padding:18px 20px 22px;}
.bc-modalpe{display:flex;align-items:center;gap:14px;padding:14px 20px 18px;
  border-top:1px solid rgba(205,194,170,.7);}
.bc-new-alt{font-size:10px;padding:7px 13px;letter-spacing:.1em;background:transparent;
  color:rgba(251,247,238,.72);border:1px solid rgba(251,247,238,.28);}
.bc-new-alt:hover{background:rgba(251,247,238,.08);color:rgba(251,247,238,.95);filter:none;}
.bc-ocrstatus{font-size:11px;line-height:1.5;color:var(--soft);margin:6px 0 0;}
.bc-ocrstatus-erro{color:var(--red);}
.bc-ocrbotoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
.bc-leitordica{margin:0 0 6px;line-height:1.5;}
.bc-leitorgrade{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px 14px;}
.bc-leitoritem{display:flex;flex-direction:column;gap:2px;border-bottom:1px dotted rgba(205,194,170,.9);
  padding-bottom:5px;}
.bc-leitorlbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);}
.bc-leitorval{font-size:14px;line-height:1.4;}
.bc-leitorvazio{color:rgba(21,16,15,.3);}
.bc-leitortexto{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
.bc-leitortexto p{margin:0;font-size:13px;line-height:1.55;white-space:pre-wrap;}
.bc-tagsbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.bc-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:2px;
  background:rgba(21,16,15,.06);border:1px solid var(--rule);}
.bc-tagx{cursor:pointer;color:rgba(21,16,15,.4);font-size:13px;line-height:1;}
.bc-tagx:hover{color:var(--red);}

.bc-fclista{display:flex;flex-direction:column;gap:10px;margin-top:6px;min-width:0;}
.bc-fclista-razao{margin:16px 0 0;}
.bc-fcreg{background:rgba(21,16,15,.03);border:1px solid var(--edge);border-left:3px solid var(--red);
  border-radius:2px;padding:11px 13px;min-width:0;overflow-wrap:anywhere;}
.bc-fclista-razao .bc-fcreg{background:var(--card);color:var(--ink);box-shadow:0 8px 18px rgba(0,0,0,.28);}
.bc-fcregtop{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
.bc-fcdata{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);flex-shrink:0;}
.bc-fcnome{flex:1 1 auto;min-width:0;font-family:'Bodoni Moda',serif;font-size:15px;font-weight:600;
  overflow-wrap:anywhere;}
.bc-fcreg .bc-linhax{margin-left:auto;flex-shrink:0;}
.bc-fccampo{margin:0 0 7px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;}
.bc-fccampo:last-child{margin-bottom:0;}
.bc-fclbl{display:block;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:1px;}

/* tela FC Skill */
.bc-fctela{max-width:820px;margin:26px auto 0;display:flex;flex-direction:column;gap:22px;}
.bc-fcgrupos{display:flex;flex-direction:column;gap:8px;}
.bc-fcgrupo{background:var(--card);color:var(--ink);border-radius:3px;padding:11px 13px;
  box-shadow:0 8px 18px rgba(0,0,0,.28);}
.bc-fcgrupotop{width:100%;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;
  font-family:inherit;background:none;border:none;padding:0;color:var(--ink);}
.bc-fcgrupo-nome{flex:1;font-family:'Bodoni Moda',serif;font-size:17px;font-weight:600;}
.bc-fcgrupo-meta{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);}
.bc-fcgrupo-seta{font-size:9px;color:var(--soft);}
.bc-fcgrupo .bc-fclista{margin-top:11px;padding-top:10px;border-top:1px solid rgba(205,194,170,.6);}

/* desbloquear */
.bc-desbrow{margin-top:2px;}
.bc-desbinput{flex:1;min-width:0;font-family:inherit;font-size:13px;padding:9px 12px;color:${C.card};
  background:rgba(251,247,238,.06);border:1px solid rgba(251,247,238,.16);border-radius:2px;}
.bc-desbinput::placeholder{color:rgba(251,247,238,.35);}
.bc-desbrow .bc-catbtn{background:var(--red);border-color:var(--red);padding:9px 15px;}
.bc-desblista{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.bc-desb{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);
  border-radius:3px;padding:10px 12px;box-shadow:0 6px 14px rgba(0,0,0,.26);
  transition:opacity .2s ease;}
.bc-desbtexto{flex:1;font-size:13.5px;line-height:1.45;word-break:break-word;}
.bc-desb-ok{opacity:.62;}
.bc-desb-ok .bc-desbtexto{text-decoration:line-through;text-decoration-color:var(--red);
  text-decoration-thickness:2px;color:var(--soft);}
.bc-desbdata{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);flex-shrink:0;}
.bc-realizado{font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 12px;cursor:pointer;border-radius:2px;color:var(--card);background:var(--ink);
  border:1px solid var(--ink);flex-shrink:0;transition:filter .15s ease;}
.bc-realizado:hover{filter:brightness(1.25);}
.bc-realizado-on{background:transparent;color:var(--soft);border-color:var(--edge);}
.bc-saber{margin-top:2px;}
.bc-midia{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.bc-midiabtn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:11px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;cursor:pointer;
  border-radius:2px;color:rgba(251,247,238,.55);background:transparent;
  border:1px dashed rgba(251,247,238,.25);}
.bc-midiabtn:hover{color:${C.card};border-color:rgba(251,247,238,.45);}
.bc-midiaicone{font-size:10px;opacity:.7;}
.bc-midiaviso{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(251,247,238,.4);}

/* confete */
.bc-confete{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
.bc-conf{position:absolute;top:-24px;border-radius:1px;opacity:.95;
  animation-name:bc-cair;animation-timing-function:cubic-bezier(.25,.6,.4,1);animation-fill-mode:forwards;}
@keyframes bc-cair{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(102vh) rotate(var(--giro));opacity:.15;}
}

/* S.Skill */
.bc-sskill{border:1px solid var(--edge);border-radius:3px;padding:12px 14px 10px;background:rgba(21,16,15,.02);}
.bc-sskilltop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.bc-sskilltop .bc-lbl{margin:0;}
.bc-sskillval{font-family:'Bodoni Moda',serif;font-size:24px;font-weight:700;color:var(--soft);line-height:1;}
.bc-sskill-pos{color:#1F7A3D;}
.bc-sskill-neg{color:var(--red);}
.bc-slider{width:100%;margin:12px 0 4px;-webkit-appearance:none;appearance:none;background:transparent;}
.bc-slider::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,${C.red} 0%,rgba(205,194,170,.9) 50%,#1F7A3D 100%);}
.bc-slider::-moz-range-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,${C.red} 0%,rgba(205,194,170,.9) 50%,#1F7A3D 100%);}
.bc-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;
  margin-top:-8px;border-radius:50%;background:${C.card};border:2px solid ${C.ink};cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.35);}
.bc-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:${C.card};
  border:2px solid ${C.ink};cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.bc-sskillescala{display:flex;align-items:center;justify-content:space-between;
  font-size:9.5px;letter-spacing:.1em;color:var(--soft);}
.bc-sskillzero{font-family:inherit;font-size:9.5px;letter-spacing:.1em;background:none;border:none;
  cursor:pointer;color:var(--soft);padding:2px 8px;text-decoration:underline;}
.bc-sskillzero:hover{color:var(--ink);}
.bc-tagsskill{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;flex-shrink:0;}
.bc-tag-pos{background:rgba(31,122,61,.12);color:#1F7A3D;}
.bc-tag-neg{background:rgba(179,18,43,.1);color:var(--red);}

/* caixa de conclusão dos objetivos */
.bc-check{width:22px;height:22px;flex-shrink:0;cursor:pointer;border-radius:2px;font-family:inherit;
  font-size:13px;line-height:1;color:var(--card);background:transparent;border:1.5px solid var(--rule);}
.bc-check-on{background:#1F7A3D;border-color:#1F7A3D;}
.bc-check:hover{border-color:var(--ink);}

.bc-cardbtns{display:flex;gap:8px;flex-wrap:wrap;}
.bc-cardbtns .bc-fcbtn{flex:1 1 120px;}
.bc-nextbtn{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
.bc-nextbtn:hover{background:var(--ink);color:var(--card);border-color:var(--ink);}
.bc-nextbloco{border:1px solid var(--edge);border-left:3px solid var(--red);border-radius:2px;
  padding:12px 13px;background:rgba(21,16,15,.02);}
.bc-nextbloco-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.bc-nextbloco-top .bc-lbl{margin:0;}
.bc-nexttexto{margin:6px 0 0;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;
  color:var(--ink);}
.bc-nextlista{display:flex;flex-direction:column;gap:9px;margin-top:9px;}
.bc-nextitem{border-top:1px dotted var(--rule);padding-top:8px;}
.bc-nextitem:first-child{border-top:none;padding-top:0;}
.bc-nextitem .bc-fcregtop{margin-bottom:0;}

.bc-botoeslista{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.bc-botaoitem{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:7px 10px;
  border-radius:2px;background:var(--card);color:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.22);}
.bc-verfc{width:100%;text-align:center;padding:11px 14px;}
.bc-nextbloco .bc-opts{margin:8px 0 4px;}

.bc-persona{border-left-color:var(--ink);background:rgba(21,16,15,.05);}
.bc-personatexto{width:100%;margin-top:6px;font-family:'Bodoni Moda',serif;font-size:15px;line-height:1.55;
  color:var(--ink);resize:vertical;background:var(--card);border:1px solid var(--edge);border-radius:2px;
  padding:9px 11px;}
.bc-personatexto::placeholder{font-family:'Archivo',sans-serif;font-size:12px;color:rgba(122,112,101,.6);}
.bc-personatexto:focus{outline:none;border-color:var(--red);}

/* botões de ação do FC Skill */
.bc-acoes{border:1px solid var(--edge);border-radius:3px;padding:11px 13px;background:rgba(21,16,15,.02);}
.bc-acoestop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
.bc-acoestop .bc-lbl{margin:0;}
.bc-acaoadd{font-family:'Archivo',system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 13px;cursor:pointer;border-radius:2px;flex-shrink:0;
  color:#15100F;background:#FBF7EE;border:1.5px solid #15100F;}
.bc-acaoadd:hover{background:#15100F;color:#FBF7EE;}
.bc-linkescuro{color:var(--soft);}
.bc-linkescuro:hover{color:var(--ink);}
.bc-acoes .bc-catrow{margin:6px 0 8px;}
.bc-acoes .bc-bancoacoes{margin-top:11px;padding-top:10px;border-top:1px dotted var(--rule);}
.bc-fcfeitos{margin:0 0 9px;}
.bc-fcfeitoslista{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;}
.bc-fctag{font-size:10.5px;letter-spacing:.04em;padding:4px 9px;border-radius:2px;
  background:var(--ink);color:var(--card);}

.bc-razao{max-width:820px;width:100%;margin:26px auto 0;padding:0 2px 40px;min-width:0;}
.bc-razaofiltros{margin:12px 0 4px;}
.bc-razaohead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}

.bc-card{background:var(--card);border-radius:12px;padding:9px;
  box-shadow:0 18px 34px rgba(0,0,0,.42),0 2px 0 rgba(255,255,255,.06);
  transition:transform .18s ease,box-shadow .18s ease;}
.bc-card:hover{transform:translateY(-3px);box-shadow:0 26px 44px rgba(0,0,0,.5);}
.bc-card-inner{position:relative;border:1px solid var(--edge);border-radius:6px;padding:26px 20px 20px;height:100%;}
.bc-card-inner::before{content:"";position:absolute;inset:4px;border:1px solid rgba(205,194,170,.45);border-radius:3px;pointer-events:none;}
@keyframes bc-deal{from{opacity:0;transform:translateY(10px) rotate(-.6deg);}to{opacity:1;transform:none;}}
.bc-deal{animation:bc-deal .38s ease-out;}

.bc-index{position:absolute;top:10px;left:12px;display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--ink);}
.bc-index-baixo{top:auto;left:auto;bottom:10px;right:12px;transform:rotate(180deg);}
.bc-index-letra{font-family:'Bodoni Moda',serif;font-weight:700;font-size:19px;}
.bc-index-naipe{font-size:12px;margin-top:2px;}
.bc-g-red{color:var(--red);}

.bc-del{position:absolute;top:8px;right:10px;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:15px;line-height:1;padding:4px 6px;color:rgba(21,16,15,.3);border-radius:2px;}
.bc-del:hover{color:var(--red);}
.bc-del-inline{position:static;font-size:14px;}

.bc-body{display:flex;flex-direction:column;gap:13px;padding:6px 8px 14px;}
.bc-lbl{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:3px;}

.bc-foto-wrap{display:flex;align-items:center;gap:12px;}
.bc-foto{flex:0 0 auto;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--rule);
  background:rgba(21,16,15,.04);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.bc-foto-img{width:100%;height:100%;object-fit:cover;display:block;}
.bc-foto-placeholder{font-size:10px;letter-spacing:.08em;color:var(--soft);}
.bc-foto-acoes{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.bc-fotoview{position:fixed;inset:0;z-index:80;background:rgba(8,6,5,.92);display:flex;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
.bc-fotoview img{max-width:100%;max-height:100%;border-radius:6px;cursor:default;
  box-shadow:0 20px 60px rgba(0,0,0,.5);}
.bc-fotoview-x{position:fixed;top:18px;right:18px;color:var(--card);font-size:22px;}
.bc-nome{width:100%;font-family:'Bodoni Moda',serif;font-size:25px;font-weight:600;color:var(--ink);
  background:transparent;border:none;border-bottom:1px solid var(--rule);padding:2px 0 5px;}
.bc-row{display:flex;gap:12px;}
.bc-input{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:transparent;
  border:none;border-bottom:1px dotted var(--rule);padding:2px 0 4px;}
.bc-nome:focus,.bc-input:focus{outline:none;border-bottom-color:var(--red);border-bottom-style:solid;}
.bc-hr{border:none;border-top:1px solid rgba(205,194,170,.6);margin:3px 0;}
.bc-group{display:block;}

/* distância por estrada */
.bc-dist{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:7px 0 0;font-size:11px;
  letter-spacing:.04em;color:var(--ink);}
.bc-dist strong{font-family:'Bodoni Moda',serif;font-size:15px;font-weight:600;}
.bc-distsep{color:rgba(122,112,101,.7);}
.bc-dist-soft{color:var(--soft);font-style:italic;}
.bc-dist-erro{color:var(--red);}
.bc-rota{margin:3px 0 0;font-size:10px;letter-spacing:.04em;color:var(--soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.bc-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
.bc-pill{font-family:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;gap:5px;color:var(--ink);background:transparent;border:1px solid var(--edge);
  transition:background .14s ease,color .14s ease,border-color .14s ease;}
.bc-pill:hover{border-color:var(--soft);}
.bc-pill-on{background:var(--ink);color:var(--card);border-color:var(--ink);}
.bc-pill-on .bc-g-red{color:#F08A98;}
.bc-x{margin-left:2px;font-size:13px;line-height:1;color:var(--red);cursor:pointer;}
.bc-add{font-family:inherit;font-size:11px;letter-spacing:.06em;padding:6px 10px;cursor:pointer;border-radius:2px;
  color:var(--soft);background:transparent;border:1px dashed var(--rule);}
.bc-add:hover{color:var(--ink);border-color:var(--soft);}
.bc-add:disabled{opacity:.5;cursor:default;}
.bc-catrow{display:flex;gap:6px;margin-top:8px;}
.bc-catinput{flex:1;min-width:0;font-family:inherit;font-size:12px;padding:6px 9px;color:var(--ink);
  background:rgba(21,16,15,.03);border:1px solid var(--edge);border-radius:2px;}
.bc-catbtn{font-family:inherit;font-size:11px;letter-spacing:.06em;padding:7px 13px;cursor:pointer;border-radius:2px;
  color:var(--card);background:var(--ink);border:1px solid var(--ink);}
.bc-notas{width:100%;margin-top:4px;font-family:inherit;font-size:13px;line-height:1.55;color:var(--ink);resize:vertical;
  background:repeating-linear-gradient(transparent,transparent 21px,rgba(205,194,170,.55) 22px);border:none;padding:1px 0;}
.bc-notas::placeholder{color:rgba(122,112,101,.6);}
.bc-notas:focus{outline:none;}
/* bancos: horas e investimento */
.bc-banco{border:1px solid var(--edge);border-radius:3px;padding:10px 11px;background:rgba(21,16,15,.02);}
.bc-bancotop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.bc-bancotop .bc-lbl{margin:0;}
.bc-saldo{font-family:'Bodoni Moda',serif;font-size:21px;font-weight:700;color:var(--red);line-height:1;}
.bc-bancorow{display:flex;align-items:center;gap:8px;margin-top:9px;}
.bc-qtd{flex:1;min-width:0;font-family:'Bodoni Moda',serif;font-size:16px;color:var(--ink);background:transparent;
  border:none;border-bottom:1px solid var(--rule);padding:2px 0 4px;}
.bc-qtd::placeholder{font-family:'Archivo',sans-serif;font-size:12px;color:rgba(122,112,101,.55);}
.bc-qtd:focus{outline:none;border-bottom-color:var(--red);}
.bc-unidade{font-size:11px;letter-spacing:.1em;color:var(--soft);flex-shrink:0;}
.bc-atalhos{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.bc-atalho{font-family:inherit;font-size:10.5px;letter-spacing:.04em;padding:4px 9px;cursor:pointer;
  border-radius:2px;color:var(--soft);background:transparent;border:1px dashed var(--rule);}
.bc-atalho:hover{color:var(--ink);border-color:var(--soft);}
.bc-comentario{width:100%;margin-top:8px;font-family:inherit;font-size:12px;line-height:1.5;color:var(--ink);
  resize:vertical;background:rgba(251,247,238,.6);border:1px solid var(--edge);border-radius:2px;padding:6px 8px;}
.bc-comentario::placeholder{color:rgba(122,112,101,.6);}
.bc-comentario:focus{outline:none;border-color:var(--red);}
.bc-conversao{margin-top:9px;padding-top:9px;border-top:1px dotted var(--rule);}
.bc-convrow{display:flex;align-items:center;gap:6px;}
.bc-convlbl{flex:1;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);}
.bc-convcifrao{font-size:12px;color:var(--soft);}
.bc-convinput{width:74px;font-family:'Bodoni Moda',serif;font-size:15px;color:var(--ink);background:transparent;
  border:none;border-bottom:1px solid var(--rule);padding:1px 0 3px;text-align:right;}
.bc-convinput::placeholder{font-family:'Archivo',sans-serif;font-size:12px;color:rgba(122,112,101,.5);}
.bc-convinput:focus{outline:none;border-bottom-color:var(--red);}
.bc-convtotal{margin:7px 0 0;font-size:11px;letter-spacing:.03em;color:var(--soft);}
.bc-convtotal strong{font-family:'Bodoni Moda',serif;font-size:17px;font-weight:700;color:var(--red);}
.bc-convneg{color:var(--red);}

.bc-fixar{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--soft);cursor:pointer;flex-shrink:0;}
.bc-fixar input{accent-color:${C.red};width:14px;height:14px;cursor:pointer;}
.bc-convinput-fixo{border-bottom-style:dashed;color:var(--soft);cursor:default;}
.bc-investbotoes{margin-top:9px;padding-top:9px;border-top:1px dotted var(--rule);}
.bc-investbotoes .bc-catrow{margin:6px 0 8px;}
.bc-investbotoes .bc-opts{margin-top:6px;}

.bc-bancoacoes{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.bc-feito{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 16px;cursor:pointer;border-radius:2px;color:var(--card);background:var(--red);border:none;
  transition:filter .15s ease;}
.bc-feito:hover:not(:disabled){filter:brightness(1.12);}
.bc-feito:disabled{opacity:.35;cursor:default;}
.bc-extrato{margin-top:10px;padding-top:8px;border-top:1px solid rgba(205,194,170,.6);
  display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;}
.bc-linha{display:flex;align-items:flex-start;gap:8px;}
.bc-linhaval{font-family:'Bodoni Moda',serif;font-size:13px;font-weight:600;color:var(--red);
  min-width:62px;flex-shrink:0;}
.bc-linhameio{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.bc-linhadata{font-size:9px;letter-spacing:.08em;color:var(--soft);}
.bc-linhacom{font-size:11.5px;line-height:1.45;color:var(--ink);word-break:break-word;}
.bc-linhax{font-family:inherit;font-size:13px;line-height:1;background:none;border:none;cursor:pointer;
  color:rgba(21,16,15,.28);padding:0 2px;}
.bc-linhax:hover{color:var(--red);}

.bc-hist{margin:2px 0 0;font-size:10px;letter-spacing:.05em;color:var(--soft);border-top:1px solid rgba(205,194,170,.5);padding-top:8px;}

/* tela mensagens */
.bc-msg-layout{max-width:1200px;margin:26px auto 0;display:grid;gap:26px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;}
.bc-col{background:rgba(251,247,238,.05);border:1px solid rgba(251,247,238,.12);border-radius:4px;padding:20px;}
.bc-colhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;}
.bc-h2{margin:0;font-family:'Bodoni Moda',serif;font-size:24px;font-weight:600;}
.bc-hint{margin:0 0 16px;font-size:11.5px;line-height:1.6;color:rgba(251,247,238,.5);}
.bc-selactions{display:flex;gap:12px;}
.bc-link{font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;
  color:rgba(251,247,238,.6);cursor:pointer;padding:2px;}
.bc-link:hover{color:${C.card};}

.bc-msglist{display:flex;flex-direction:column;gap:10px;}
.bc-msgcard{background:var(--card);border-radius:3px;padding:12px 14px;color:var(--ink);
  border-left:3px solid var(--edge);box-shadow:0 8px 18px rgba(0,0,0,.28);}
.bc-msgcard-open{border-left-color:var(--red);}
.bc-msgtop{display:flex;align-items:center;gap:10px;}
.bc-msgtitle{flex:1;text-align:left;font-family:'Bodoni Moda',serif;font-size:17px;font-weight:600;color:var(--ink);
  background:none;border:none;cursor:pointer;padding:0;}
.bc-langdots{display:flex;gap:4px;}
.bc-dot{font-style:normal;font-size:9px;letter-spacing:.08em;padding:3px 5px;border:1px solid var(--edge);
  border-radius:2px;color:rgba(21,16,15,.3);}
.bc-dot-on{background:var(--ink);color:var(--card);border-color:var(--ink);}
.bc-msgbody{display:flex;flex-direction:column;gap:13px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(205,194,170,.6);}
.bc-msgtext{width:100%;margin-top:4px;font-family:inherit;font-size:13px;line-height:1.55;color:var(--ink);resize:vertical;
  background:rgba(21,16,15,.03);border:1px solid var(--edge);border-radius:2px;padding:8px 10px;}
.bc-msgtext:focus{outline:none;border-color:var(--red);}
.bc-mini{margin:6px 0 0;font-size:10.5px;color:var(--soft);}

.bc-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.bc-pick{font-family:inherit;font-size:12px;padding:7px 11px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;gap:7px;color:rgba(251,247,238,.75);background:transparent;
  border:1px solid rgba(251,247,238,.2);}
.bc-pick .bc-g-red{color:#E86A7C;}
.bc-pick-idi{font-size:9px;letter-spacing:.1em;opacity:.6;}
.bc-pick-dist{font-size:9.5px;letter-spacing:.06em;opacity:.7;}
.bc-pick-on{background:${C.card};color:${C.ink};border-color:${C.card};}
.bc-pick-on .bc-g-red{color:var(--red);}
.bc-checkline{display:flex;align-items:center;gap:8px;font-size:11.5px;color:rgba(251,247,238,.55);margin-bottom:18px;}

.bc-previas{display:flex;flex-direction:column;gap:12px;}
.bc-prevhead{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(251,247,238,.14);padding-top:14px;}
.bc-prevhead .bc-lbl{color:rgba(251,247,238,.5);margin:0;}
.bc-prev{background:var(--card);color:var(--ink);border-radius:3px;padding:13px 15px;box-shadow:0 8px 18px rgba(0,0,0,.28);}
.bc-prevtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.bc-prevnome{font-family:'Bodoni Moda',serif;font-size:16px;font-weight:600;flex:1;}
.bc-prevdist{font-size:10px;letter-spacing:.06em;color:var(--soft);}
.bc-prevtag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);}
.bc-prevtexto{margin:0;font-size:13px;line-height:1.6;white-space:pre-wrap;}
.bc-aviso{margin:8px 0 0;font-size:11px;line-height:1.5;color:var(--red);}
.bc-prevacoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

.bc-pill:focus-visible,.bc-chip:focus-visible,.bc-new:focus-visible,.bc-add:focus-visible,.bc-tab:focus-visible,
.bc-catbtn:focus-visible,.bc-search:focus-visible,.bc-catinput:focus-visible,.bc-pick:focus-visible,
.bc-link:focus-visible,.bc-msgtitle:focus-visible,.bc-del:focus-visible,.bc-homeinput:focus-visible,
.bc-raioinput:focus-visible,.bc-feito:focus-visible,.bc-qtd:focus-visible,
.bc-comentario:focus-visible,.bc-linhax:focus-visible,.bc-acaoadd:focus-visible,.bc-recolher:focus-visible,.bc-backupbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

@media (max-width:860px){
  .bc-msg-layout{grid-template-columns:1fr;}
}
@media (max-width:520px){
  .bc-root{padding:24px 16px 56px;}
  .bc-head-right{width:100%;align-items:flex-start;gap:11px;}
  .bc-tabs{width:100%;}
  .bc-tab{flex:1 1 auto;padding:9px 8px;letter-spacing:.06em;text-align:center;}
  .bc-tab em{margin-left:4px;}
  .bc-saveblock{width:100%;align-items:flex-start;}
  .bc-title{font-size:40px;}
  .bc-grid{grid-template-columns:1fr;}
  .bc-homeinput{min-width:150px;}
  .bc-dating{grid-template-columns:1fr;}
  .bc-lc-nome{font-size:16px;}
  .bc-lc-dado,.bc-lc-local{font-size:11.5px;}
  .bc-linhacarta{padding:11px 11px;}
  .bc-lista{gap:9px;}
  .bc-modal{padding:14px 10px;}
}
@media (prefers-reduced-motion:reduce){
  .bc-card,.bc-new{transition:none;}
  .bc-deal{animation:none;}
  .bc-confete{display:none;}
}
`;
// ---------- Montagem ----------
const raiz = ReactDOM.createRoot(document.getElementById('root'));
raiz.render(React.createElement(BaralhoDeContatos));

</script>
</body>
</html>
