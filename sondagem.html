<script>
  // ─── shim de window.storage sobre o localStorage real do navegador ───
  // (idêntico ao do Cherubion — mesma assinatura get/set/delete/list)
  (function () {
    function fullKey(key, shared) { return (shared ? 'shared:' : 'priv:') + key; }
    window.storage = {
      async get(key, shared) {
        try {
          const raw = window.localStorage.getItem(fullKey(key, shared));
          if (raw === null) return null;
          return { key, value: raw, shared: !!shared };
        } catch (e) { return null; }
      },
      async set(key, value, shared) {
        try {
          window.localStorage.setItem(fullKey(key, shared), value);
          return { key, value, shared: !!shared };
        } catch (e) { return null; }
      },
      async delete(key, shared) {
        try {
          window.localStorage.removeItem(fullKey(key, shared));
          return { key, deleted: true, shared: !!shared };
        } catch (e) { return null; }
      },
      async list(prefix, shared) {
        try {
          const marker = shared ? 'shared:' : 'priv:';
          const out = [];
          for (let i = 0; i < window.localStorage.length; i++) {
            const k = window.localStorage.key(i);
            if (k && k.startsWith(marker)) {
              const bare = k.slice(marker.length);
              if (!prefix || bare.startsWith(prefix)) out.push(bare);
            }
          }
          return { keys: out, prefix, shared: !!shared };
        } catch (e) { return null; }
      },
    };
  })();

  // captura qualquer erro fatal de JS e mostra na tela em vez de deixar tudo branco
  function mostrarErroFatal(titulo, detalhe) {
    var el = document.getElementById('erro-fatal');
    var carr = document.getElementById('carregando');
    if (carr) carr.style.display = 'none';
    if (el) {
      el.style.display = 'block';
      el.innerHTML = '<b>' + titulo + '</b><br>' + detalhe;
    }
  }
  window.addEventListener('error', function (ev) {
    mostrarErroFatal('Erro ao carregar o app:',
      (ev.message || ev) + '<br><small>' + (ev.filename || '') + ':' + (ev.lineno || '') + '</small>');
  });
</script>

const lerConfigR2 = () => {
  try {
    return {
      url: (window.localStorage.getItem(R2_URL_KEY) || "").replace(/\/+$/, ""),
      token: window.localStorage.getItem(R2_TOKEN_KEY) || ""

  } catch (e) {
    return { url: "", token: "" };
  }
};
const comprimirImagemParaUpload = (file) => new Promise((resolve, reject) => {
  const img = new Image();
  const objUrl = URL.createObjectURL(file);
  img.onload = () => {
    const MAX_LARGURA = 1280;
    let { width, height } = img;
    if (width > MAX_LARGURA) {
      height = Math.round(height * (MAX_LARGURA / width));
      width = MAX_LARGURA;
    }
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    canvas.getContext("2d").drawImage(img, 0, 0, width, height);
    canvas.toBlob((blob) => {
      URL.revokeObjectURL(objUrl);
      if (blob) resolve(blob);
      else reject(new Error("Não deu para comprimir essa imagem."));
    }, "image/jpeg", 0.75);
  };
  img.onerror = () => {
    URL.revokeObjectURL(objUrl);
    reject(new Error("Esse arquivo não é uma imagem válida."));
  };
  img.src = objUrl;
});

const subirArquivoParaR2Sondagem = async (blob, nomeOriginal) => {
  const { url, token } = lerConfigR2();
  if (!url || !token) throw new Error("sem-config");
  const ext = (String(nomeOriginal || "").split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8) || "bin";
  const nomeArquivo = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const resp = await fetch(`${url}/upload`, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": blob.type || "application/octet-stream",
      "X-Filename": nomeArquivo,
      "X-Folder": R2_PASTA_SONDAGEM
    },
    body: blob
  });
  if (!resp.ok) throw new Error(`upload falhou (${resp.status})`);
  const dados = await resp.json();
  if (!dados || !dados.url) throw new Error("resposta do Worker sem url");
  return { url: dados.url, key: dados.key || "" };
};
const apagarArquivoDoR2Sondagem = async (key) => {
  if (!key) return;
  try {
    const { url, token } = lerConfigR2();
    if (!url || !token) return;
    await fetch(`${url}/${key}`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}` } });
  } catch (e) {
  }
};
