<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<!-- ══════════════════════════════════════════════════════════════════════
     CASCA FIXA DO CHERUBION — sobe uma vez e NUNCA MAIS precisa ser trocada.
     Todo o app vive no app.js, que é buscado aqui embaixo sempre com uma URL
     nova (?v=timestamp) + cache:'no-store'. Assim o Safari nunca consegue
     servir uma versão velha, e você nunca mais precisa apagar e re-adicionar
     o atalho da Tela de Início (o que apagava o localStorage).
     Para atualizar o app: substitua SOMENTE o app.js no GitHub.
     ══════════════════════════════════════════════════════════════════════ -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Minha Tela</title>
<!-- ícone/nome do atalho na Tela de Início do iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Minha Tela" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
  #carregando {
    padding: 40px 16px; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #7a7a7a; font-size: 15px;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="carregando">carregando…</div>
<div id="erro-fatal" style="display:none; padding:16px; font-family:-apple-system,sans-serif; color:#a00;"></div>

<script>
  // ─── shim de window.storage sobre o localStorage real do navegador ───
  (function () {
    function fullKey(key, shared) { return (shared ? 'shared:' : 'priv:') + key; }
    window.storage = {
      async get(key, shared) {
        try {
          const raw = window.localStorage.getItem(fullKey(key, shared));
          if (raw === null) return null;
          return { key, value: raw, shared: !!shared };
        } catch (e) { return null; }
      },
      async set(key, value, shared) {
        try {
          window.localStorage.setItem(fullKey(key, shared), value);
          return { key, value, shared: !!shared };
        } catch (e) { return null; }
      },
      async delete(key, shared) {
        try {
          window.localStorage.removeItem(fullKey(key, shared));
          return { key, deleted: true, shared: !!shared };
        } catch (e) { return null; }
      },
      async list(prefix, shared) {
        try {
          const marker = shared ? 'shared:' : 'priv:';
          const out = [];
          for (let i = 0; i < window.localStorage.length; i++) {
            const k = window.localStorage.key(i);
            if (k && k.startsWith(marker)) {
              const bare = k.slice(marker.length);
              if (!prefix || bare.startsWith(prefix)) out.push(bare);
            }
          }
          return { keys: out, prefix, shared: !!shared };
        } catch (e) { return null; }
      },
    };
  })();

  // captura qualquer erro fatal de JS e mostra na tela em vez de deixar tudo branco
  function mostrarErroFatal(titulo, detalhe) {
    var el = document.getElementById('erro-fatal');
    var carr = document.getElementById('carregando');
    if (carr) carr.style.display = 'none';
    if (el) {
      el.style.display = 'block';
      el.innerHTML = '<b>' + titulo + '</b><br>' + detalhe;
    }
  }
  window.addEventListener('error', function (ev) {
    mostrarErroFatal('Erro ao carregar o app:',
      (ev.message || ev) + '<br><small>' + (ev.filename || '') + ':' + (ev.lineno || '') + '</small>');
  });
</script>

<script>
  // ─── carregador do miolo (app.js) — sempre a versão mais nova ───
  (function () {
    var CACHE = 'cherubion-app';
    var ARQUIVO = 'app.js';

    function executar(codigo) {
      var s = document.createElement('script');
      s.textContent = codigo;
      document.body.appendChild(s);
      var carr = document.getElementById('carregando');
      if (carr) carr.parentNode.removeChild(carr);
    }

    // guarda a última versão que funcionou, para o app abrir mesmo sem internet
    function guardarNoCache(texto) {
      try {
        if (!window.caches) return;
        caches.open(CACHE).then(function (c) {
          c.put(ARQUIVO, new Response(texto, {
            headers: { 'Content-Type': 'application/javascript' }
          }));
        });
      } catch (e) { /* cache é um extra: se falhar, o app segue normal */ }
    }

    function tentarCache(motivo) {
      if (!window.caches) {
        mostrarErroFatal('Não foi possível carregar o app.', motivo + '<br>Verifique a conexão e tente de novo.');
        return;
      }
      caches.open(CACHE)
        .then(function (c) { return c.match(ARQUIVO); })
        .then(function (resp) {
          if (!resp) throw new Error('sem cópia guardada');
          return resp.text();
        })
        .then(executar)
        .catch(function () {
          mostrarErroFatal('Não foi possível carregar o app.', motivo + '<br>Verifique a conexão e tente de novo.');
        });
    }

    // URL única a cada abertura + no-store = o Safari nunca serve versão antiga
    fetch(ARQUIVO + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (codigo) {
        if (!codigo || codigo.indexOf('function App(') === -1) {
          throw new Error('app.js veio incompleto');
        }
        guardarNoCache(codigo);
        executar(codigo);
      })
      .catch(function (e) {
        tentarCache('Usando a última versão guardada não foi possível: ' + e.message + '.');
      });
  })();
</script>
</body>
</html>
