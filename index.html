<script>
  // ─── shim de window.storage sobre o localStorage real do navegador ───
  (function () {
    function fullKey(key, shared) { return (shared ? 'shared:' : 'priv:') + key; }
    window.storage = {
      async get(key, shared) {
        try {
          const raw = window.localStorage.getItem(fullKey(key, shared));
          if (raw === null) return null;
          return { key, value: raw, shared: !!shared };
        } catch (e) { return null; }
      },
      async set(key, value, shared) {
        try {
          window.localStorage.setItem(fullKey(key, shared), value);
          return { key, value, shared: !!shared };
        } catch (e) { return null; }
      },
      async delete(key, shared) {
        try {
          window.localStorage.removeItem(fullKey(key, shared));
          return { key, deleted: true, shared: !!shared };
        } catch (e) { return null; }
      },
      async list(prefix, shared) {
        try {
          const marker = shared ? 'shared:' : 'priv:';
          const out = [];
          for (let i = 0; i < window.localStorage.length; i++) {
            const k = window.localStorage.key(i);
            if (k && k.startsWith(marker)) {
              const bare = k.slice(marker.length);
              if (!prefix || bare.startsWith(prefix)) out.push(bare);
            }
          }
          return { keys: out, prefix, shared: !!shared };
        } catch (e) { return null; }
      },
    };
  })();

  // captura qualquer erro fatal de JS e mostra na tela em vez de deixar tudo branco
  window.addEventListener('error', function (ev) {
    const el = document.getElementById('erro-fatal');
    if (el) {
      el.style.display = 'block';
      el.innerHTML = '<b>Erro ao carregar o app:</b><br>' + (ev.message || ev) + '<br><small>' + (ev.filename || '') + ':' + (ev.lineno || '') + '</small>';
    }
  });
</script>

// calcula a próxima ocorrência de um item da agenda em relação a hoje; retorna null se já passou e não repete
const calcularOcorrenciaAgenda = (item, hojeIso) => {
    if (!item || !item.data)
        return null;
    const diffBase = diasEntreISO(item.data, hojeIso); // hoje - âncora
    if (diffBase < 0)
        return { diasRestantes: -diffBase, dataOcorrencia: item.data };
    const repetir = item.repetir || 'nenhuma';
    if (repetir === 'nenhuma')
        return diffBase === 0 ? { diasRestantes: 0, dataOcorrencia: item.data } : null;
    if (repetir === 'diaria')
        return { diasRestantes: 0, dataOcorrencia: hojeIso };
    if (repetir === 'semanal' || repetir === 'quinzenal' || repetir === 'customizada') {
        const periodo = repetir === 'semanal' ? 7 : repetir === 'quinzenal' ? 14 : Math.max(1, Number(item.intervaloDias) || 1);
        const resto = diffBase % periodo;
        if (resto === 0)
            return { diasRestantes: 0, dataOcorrencia: hojeIso };
        const faltam = periodo - resto;
        return { diasRestantes: faltam, dataOcorrencia: somarDiasISO(hojeIso, faltam) };
    }
    if (repetir === 'mensal') {
        const ancD = dataDeISO(item.data).getDate();
        const hj = dataDeISO(hojeIso);
        let candidato = new Date(hj.getFullYear(), hj.getMonth(), ancD);
        if (candidato < hj)
            candidato = new Date(hj.getFullYear(), hj.getMonth() + 1, ancD);
        return { diasRestantes: Math.round((candidato - hj) / 86400000), dataOcorrencia: paraISO(candidato) };
    }
    if (repetir === 'anual') {
        const anc = dataDeISO(item.data);
        const hj = dataDeISO(hojeIso);
        let candidato = new Date(hj.getFullYear(), anc.getMonth(), anc.getDate());
        if (candidato < hj)
            candidato = new Date(hj.getFullYear() + 1, anc.getMonth(), anc.getDate());
        return { diasRestantes: Math.round((candidato - hj) / 86400000), dataOcorrencia: paraISO(candidato) };
    }
    return null;
};

        const novoId = uidObsidianSync();
        notes = criarNotaObsidianSeNaoExiste(notes, novoId, 'Bem-vindo');
        idContainerReal = novoId;
    }
    const containerAtual = notes[idContainerReal];
    let conteudoContainer = containerAtual ? containerAtual.content : '';
    const remotoNivel = linksUnicosDoTexto(conteudoContainer)
        .map((titulo) => porTitulo[titulo.toLowerCase()])
        .filter(Boolean)
        .map((n) => ({ id: n.id, nome: n.title }));
    const mapaPorId = (lista) => { const m = {}; (lista || []).forEach((n) => { m[n.id] = n; }); return m; };
    const A = mapaPorId(anteriorLista);
    const L = mapaPorId(pastasCherubionNivel);
    const R = mapaPorId(remotoNivel);
    const todosIds = new Set([...Object.keys(A), ...Object.keys(L), ...Object.keys(R)]);
    const novaListaCherubion = [];
    const novaCanonica = [];
    let mudouCherubion = false;
    let mudouObsidian = false;
    todosIds.forEach((id) => {
        const emA = A[id];
        const emL = L[id];
        const emR = R[id];
        if (emL && emR) {
            // existe nos dois lados: reconcilia nome (só o Obsidian tem UI de renomear hoje)
            let nomeFinal = emL.nome;
            if (emA && emR.nome !== emA.nome && emL.nome === emA.nome)
                nomeFinal = emR.nome;
            if (nomeFinal !== emL.nome)
                mudouCherubion = true;
            if (nomeFinal !== notes[id].title) {
                notes = { ...notes, [id]: { ...notes[id], title: nomeFinal, updatedAt: Date.now() } };
            }
            const filho = sincronizarNivelPastas({
                anteriorLista: emA ? emA.subpastas : [],
                pastasCherubionNivel: emL.subpastas,
                notesObsidian: notes,
                containerId: id,
                idsApagadosCherubion,
            });
            notes = filho.notes;
            if (filho.mudouCherubion)
                mudouCherubion = true;
            if (filho.mudouObsidian)
                mudouObsidian = true;
            novaListaCherubion.push({ ...emL, nome: nomeFinal, subpastas: filho.novaListaCherubion });
            novaCanonica.push({ id, nome: nomeFinal, subpastas: filho.novaCanonica });
        }
        else if (emL && !emR) {
            if (emA) {
                // existia nos dois antes, sumiu do Obsidian agora -> o Obsidian apagou -> apaga aqui também
                if (id === 'geral') {
                    // 'Geral' nunca é apagada: só recria o link que faltou
                    notes = criarNotaObsidianSeNaoExiste(notes, 'geral', 'Geral');
                    conteudoContainer = adicionarLinkAoConteudo(conteudoContainer, 'Geral');
                    mudouObsidian = true;
                    novaListaCherubion.push(emL);
                    novaCanonica.push({ id, nome: emL.nome, subpastas: arvoreCanonicaDoCherubion(emL.subpastas) });
                }
                else {
                    mudouCherubion = true;
                    if (idsApagadosCherubion)
                        idsApagadosCherubion.push(id);
                }
            }
            else {
                // pasta nova só no Cherubion -> cria a nota (e as das subpastas) no Obsidian
                notes = criarSubarvoreNoObsidian(notes, emL);
                conteudoContainer = adicionarLinkAoConteudo(conteudoContainer, emL.nome);
                mudouObsidian = true;
                novaListaCherubion.push(emL);
                novaCanonica.push({ id, nome: emL.nome, subpastas: arvoreCanonicaDoCherubion(emL.subpastas) });
            }
        }
        else if (!emL && emR) {
            if (emA) {
                // existia nos dois antes, sumiu do Cherubion agora -> apaga a nota espelhada
                notes = apagarSubarvoreDoObsidian(notes, id);
                conteudoContainer = removerLinkDoConteudo(conteudoContainer, emR.nome);
                mudouObsidian = true;
            }
            else {
                // link novo só no Obsidian -> cria a pasta (e subpastas) aqui no Cherubion
                const subarvore = subarvoreCanonicaDoObsidian(notes, id);
                novaListaCherubion.push(canonicaParaPastaCherubion(subarvore));
                novaCanonica.push(subarvore);
                mudouCherubion = true;
            }
        }
        // se sumiu dos dois lados, a exclusão já foi propagada numa sincronização anterior: ignora
    });
    if (containerAtual && conteudoContainer !== containerAtual.content) {
        notes = { ...notes, [idContainerReal]: { ...notes[idContainerReal], content: conteudoContainer, updatedAt: Date.now() } };
        mudouObsidian = true;
    }
    return { notes, novaListaCherubion, novaCanonica, mudouCherubion, mudouObsidian };
};

const storageExiste = () => typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
// ═══════════════════════════════════════════════════════════════════════
// CLOUDFLARE R2: armazenamento de imagens e vídeos, compartilhado entre os
// 3 apps do Cherubion (mesma origem do GitHub Pages = mesmo localStorage).
// Fica FORA do backup em JSON de propósito — é credencial do dispositivo,
// não dado do usuário — do mesmo jeito que o token do Gist dos Contatos.
// ═══════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
// CLOUDFLARE R2: armazenamento de imagens e vídeos, compartilhado entre os
// 3 apps do Cherubion (mesma origem do GitHub Pages = mesmo localStorage).
// Fica FORA do backup em JSON de propósito — é credencial do dispositivo,
// não dado do usuário — do mesmo jeito que o token do Gist dos Contatos.
// ═══════════════════════════════════════════════════════════════════════
const R2_URL_KEY = 'cherubion:r2workerurl';
const R2_TOKEN_KEY = 'cherubion:r2token';
const lerConfigR2 = () => {
    try {
        return {
            url: (window.localStorage.getItem(R2_URL_KEY) || '').replace(/\/+$/, ''),
            token: window.localStorage.getItem(R2_TOKEN_KEY) || '',
        };
    }
    catch (e) {
        return { url: '', token: '' };
    }
};
const salvarConfigR2 = (url, token) => {
    try {
        window.localStorage.setItem(R2_URL_KEY, String(url || '').trim());
        window.localStorage.setItem(R2_TOKEN_KEY, String(token || '').trim());
        return true;
    }
    catch (e) {
        return false;
    }
};
// comprime uma imagem antes de subir (reduz para no máx. 1280px de largura, JPEG 75%) —
// corta o tamanho típico de uma foto de celular em ~80-90%, sem perda visual perceptível
// numa tela de celular. Vídeo NÃO passa por aqui (comprimir vídeo no navegador é inviável).
// comprime uma imagem antes de subir (reduz para no máx. 1280px de largura, JPEG 75%) —
// corta o tamanho típico de uma foto de celular em ~80-90%, sem perda visual perceptível
// numa tela de celular. Vídeo NÃO passa por aqui (comprimir vídeo no navegador é inviável).
const comprimirImagemParaUpload = (file) => new Promise((resolve, reject) => {
    const img = new Image();
    const objUrl = URL.createObjectURL(file);
    img.onload = () => {
        const MAX_LARGURA = 1280;
        let { width, height } = img;
        if (width > MAX_LARGURA) {
            height = Math.round(height * (MAX_LARGURA / width));
            width = MAX_LARGURA;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
            URL.revokeObjectURL(objUrl);
            if (blob)
                resolve(blob);
            else
                reject(new Error('falha ao comprimir a imagem'));
        }, 'image/jpeg', 0.75);
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error('falha ao carregar a imagem')); };
    img.src = objUrl;
});
// sobe um arquivo (Blob ou File) pro Worker do Cloudflare R2 e devolve a URL pública dele.
// Lança 'sem-config' se o Worker/token ainda não foram configurados nas Configurações gerais.
// sobe um arquivo (Blob ou File) pro Worker do Cloudflare R2 e devolve a URL pública dele.
// Lança 'sem-config' se o Worker/token ainda não foram configurados nas Configurações gerais.
const subirArquivoParaR2 = async (blob, nomeOriginal) => {
    const { url, token } = lerConfigR2();
    if (!url || !token)
        throw new Error('sem-config');
    const ext = (String(nomeOriginal || '').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'bin';
    const nomeArquivo = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const resp = await fetch(`${url}/upload`, {
        method: 'POST',
        headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': blob.type || 'application/octet-stream',
            'X-Filename': nomeArquivo,
        },
        body: blob,
    });
    if (!resp.ok)
        throw new Error(`upload falhou (${resp.status})`);
    const dados = await resp.json();
    if (!dados || !dados.url)
        throw new Error('resposta do Worker sem url');
    return dados.url;
};
