<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico — armazenamento de mídia</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#15100F;color:#FBF7EE;padding:20px;line-height:1.5;}
  h1{font-size:18px;margin-bottom:4px;}
  .origem{font-size:12px;color:#B8AFA5;margin-bottom:24px;word-break:break-all;}
  .bloco{background:#241C1A;border:1px solid #3A2E2A;border-radius:6px;padding:14px;margin-bottom:14px;}
  .rotulo{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#B8AFA5;margin-bottom:6px;}
  .valor{font-size:14px;word-break:break-all;font-family:ui-monospace,monospace;}
  .vazio{color:#E86A7C;font-style:italic;}
  .ok{color:#8FCB9B;}
  input{width:100%;box-sizing:border-box;padding:10px;margin-top:8px;border-radius:4px;border:1px solid #3A2E2A;
    background:#FBF7EE;color:#15100F;font-size:14px;}
  button{width:100%;padding:12px;margin-top:10px;border-radius:4px;border:none;background:#FBF7EE;color:#15100F;
    font-weight:600;cursor:pointer;font-size:14px;}
  button:active{opacity:.8;}
  .btnperigo{background:#E86A7C;color:#fff;}
  .aviso{font-size:12px;color:#B8AFA5;margin-top:6px;}
</style>
</head>
<body>
  <h1>Diagnóstico de armazenamento</h1>
  <div class="origem" id="origem"></div>

  <div class="bloco">
    <div class="rotulo">cherubion:r2workerurl (valor gravado agora)</div>
    <div class="valor" id="valorUrl">carregando…</div>
  </div>

  <div class="bloco">
    <div class="rotulo">cherubion:r2token (valor gravado agora)</div>
    <div class="valor" id="valorToken">carregando…</div>
  </div>

  <div class="bloco">
    <div class="rotulo">testar manualmente (opcional)</div>
    <div class="aviso">Preencha aqui e toque em "gravar" para testar direto, sem passar pelo Minha Tela.</div>
    <input id="inputUrl" placeholder="https://....workers.dev">
    <input id="inputToken" placeholder="token">
    <button id="btnGravar">Gravar esses valores aqui</button>
    <button id="btnLimpar" class="btnperigo">Apagar os dois valores</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const mostrar = () => {
      $("origem").textContent = "Origem atual: " + window.location.origin;
      const u = window.localStorage.getItem("cherubion:r2workerurl") || "";
      const t = window.localStorage.getItem("cherubion:r2token") || "";
      const elU = $("valorUrl");
      const elT = $("valorToken");
      if (u) { elU.textContent = u; elU.className = "valor ok"; }
      else { elU.textContent = "(vazio — nada gravado)"; elU.className = "valor vazio"; }
      if (t) { elT.textContent = t.slice(0, 6) + "…" + t.slice(-4) + "  (" + t.length + " caracteres)"; elT.className = "valor ok"; }
      else { elT.textContent = "(vazio — nada gravado)"; elT.className = "valor vazio"; }
    };

    $("btnGravar").addEventListener("click", () => {
      const u = $("inputUrl").value.trim();
      const t = $("inputToken").value.trim();
      if (u) window.localStorage.setItem("cherubion:r2workerurl", u);
      if (t) window.localStorage.setItem("cherubion:r2token", t);
      mostrar();
      alert("Gravado. Agora abra o Contatos e toque em 'verificar de novo'.");
    });

    $("btnLimpar").addEventListener("click", () => {
      window.localStorage.removeItem("cherubion:r2workerurl");
      window.localStorage.removeItem("cherubion:r2token");
      mostrar();
    });

    mostrar();
  </script>
</body>
</html>
